# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-duo-os"
BBFILE_PATTERN_meta-duo-os = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-duo-os = "7"

LAYERDEPENDS_meta-duo-os = "core riscv-layer openembedded-layer"
LAYERSERIES_COMPAT_meta-duo-os = "blacksail"
