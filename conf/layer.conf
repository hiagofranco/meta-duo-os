# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-milkvduo"
BBFILE_PATTERN_meta-milkvduo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-milkvduo = "7"

LAYERDEPENDS_meta-milkvduo = "core riscv-layer"
LAYERSERIES_COMPAT_meta-milkvduo = "blacksail"
